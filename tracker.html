<!DOCTYPE html>
<html>
<head>
  <title>AR Hand Tracker - Advanced Visuals</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: monospace; color: black; user-select: none; }
    #videoElement { display: none; } 
    #outputCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }
    
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; font-size: 18px; background: rgba(255,255,255,0.9); padding: 20px; border-radius: 8px; font-weight: bold; }
    
    #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(255, 255, 255, 0.85); padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
    .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
    button { padding: 8px 12px; font-size: 13px; cursor: pointer; border: 1px solid #aaa; background: white; border-radius: 4px; font-weight: bold; transition: 0.2s; }
    button:hover { background: #ddd; }
    button:active { background: #bbb; }
    .status-text { font-size: 14px; margin-bottom: 6px; font-weight: bold; color: #333; }
    hr { border: 0; border-top: 1px solid #ccc; margin: 10px 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="loading">Loading Advanced Models...</div>
  
  <div id="ui-container">
    <div class="status-text" id="mode-text">Active: Rubik's Cube</div>
    <hr>
    <div class="btn-row">
      <button onclick="setShape('Rubiks')">Rubik's Cube</button>
      <button onclick="setShape('SmartDust')">Smart Dust Swarm</button>
      <button onclick="setShape('TorusKnot')">Torus Knot</button>
    </div>
    <div class="btn-row">
      <button onclick="resetMesh()">Reset Size</button>
    </div>
  </div>

  <video id="videoElement" autoplay playsinline></video>
  <canvas id="outputCanvas"></canvas>
  <canvas id="threeCanvas"></canvas>

  <script>
    // --- 1. SETUP 3D SCENE ---
    const width = window.innerWidth;
    const height = window.innerHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('threeCanvas'), alpha: true, antialias: true });
    renderer.setSize(width, height);
    camera.position.z = 5;

    let currentMesh;
    let targetPosition = new THREE.Vector3(0, 0, 0);
    let targetScale = 1;
    let targetRotationZ = 0;
    let handsDetected = 0;

    function setShape(shapeName) {
      if (currentMesh) scene.remove(currentMesh);
      
      if (shapeName === 'Rubiks') {
        currentMesh = new THREE.Group();
        // The 6 standard Rubik's Cube colors
        const materials = [
          new THREE.MeshBasicMaterial({color: 0xff0000}), // Right (Red)
          new THREE.MeshBasicMaterial({color: 0xff8800}), // Left (Orange)
          new THREE.MeshBasicMaterial({color: 0xffffff}), // Top (White)
          new THREE.MeshBasicMaterial({color: 0xffff00}), // Bottom (Yellow)
          new THREE.MeshBasicMaterial({color: 0x00ff00}), // Front (Green)
          new THREE.MeshBasicMaterial({color: 0x0000ff})  // Back (Blue)
        ];
        
        const boxGeo = new THREE.BoxGeometry(0.48, 0.48, 0.48);
        // Build the 3x3x3 grid
        for(let x=-1; x<=1; x++) {
          for(let y=-1; y<=1; y++) {
            for(let z=-1; z<=1; z++) {
              const piece = new THREE.Mesh(boxGeo, materials);
              
              // Add black grid outlines
              const edges = new THREE.EdgesGeometry(boxGeo);
              const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x000000, linewidth: 2}));
              piece.add(line);
              
              piece.position.set(x*0.5, y*0.5, z*0.5);
              currentMesh.add(piece);
            }
          }
        }
      } 
      else if (shapeName === 'SmartDust') {
        // Generates a cloud of 1,500 individual points
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 1500;
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i=0; i<particleCount*3; i++) {
          posArray[i] = (Math.random() - 0.5) * 3; 
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particleMat = new THREE.PointsMaterial({
          size: 0.04,
          color: 0x00ffff,
          transparent: true,
          opacity: 0.8
        });
        currentMesh = new THREE.Points(particleGeo, particleMat);
      } 
      else if (shapeName === 'TorusKnot') {
        const geo = new THREE.TorusKnotGeometry(0.8, 0.25, 128, 16);
        const mat = new THREE.MeshNormalMaterial();
        currentMesh = new THREE.Mesh(geo, mat);
      }

      scene.add(currentMesh);
      document.getElementById('mode-text').innerText = `Active: ${shapeName}`;
    }

    function resetMesh() {
      targetPosition.set(0, 0, 0);
      targetScale = 1;
      targetRotationZ = 0;
      currentMesh.position.set(0,0,0);
      currentMesh.scale.set(1,1,1);
      currentMesh.rotation.set(0,0,0);
    }

    // Start with the Rubik's Cube
    setShape('Rubiks');

    function animate() {
      requestAnimationFrame(animate);
      
      if (currentMesh) {
        if (handsDetected > 0) {
          currentMesh.position.lerp(targetPosition, 0.15);
          
          if (handsDetected === 2) {
            const currentScale = currentMesh.scale.x;
            const newScale = currentScale + (targetScale - currentScale) * 0.15;
            currentMesh.scale.set(newScale, newScale, newScale);
            currentMesh.rotation.z += (targetRotationZ - currentMesh.rotation.z) * 0.15;
          }
        }
        
        currentMesh.rotation.x += 0.01;
        currentMesh.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    }
    animate();

    // --- 2. SETUP HAND TRACKING ---
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    function onResults(results) {
      document.getElementById('loading').style.display = 'none';
      
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
      
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handsDetected = results.multiHandLandmarks.length;

        for (const landmarks of results.multiHandLandmarks) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
          drawLandmarks(canvasCtx, landmarks, {color: '#cccccc', lineWidth: 1, radius: 2});
        }
        
        if (handsDetected === 1) {
          const palm = results.multiHandLandmarks[0][9];
          targetPosition.x = (0.5 - palm.x) * 12; 
          targetPosition.y = -(palm.y - 0.5) * 12;
          
        } else if (handsDetected === 2) {
          const palm1 = results.multiHandLandmarks[0][9]; 
          const palm2 = results.multiHandLandmarks[1][9]; 
          
          const midX = (palm1.x + palm2.x) / 2;
          const midY = (palm1.y + palm2.y) / 2;
          targetPosition.x = (0.5 - midX) * 12; 
          targetPosition.y = -(midY - 0.5) * 12;
          
          const dx = palm1.x - palm2.x;
          const dy = palm1.y - palm2.y;
          const distance = Math.sqrt(dx*dx + dy*dy);
          
          let calcScale = distance * 6;
          targetScale = Math.max(0.1, Math.min(calcScale, 10)); 
          targetRotationZ = -Math.atan2(dy, dx); 
        }
      } else {
        handsDetected = 0;
      }
      canvasCtx.restore();
    }

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 1280, height: 720 });
    cameraUtils.start();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
